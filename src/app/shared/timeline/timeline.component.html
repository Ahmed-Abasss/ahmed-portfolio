<section [id]="sectionId" class="section" [class.section--alt]="alt">
  <div class="container">
    <app-section-header [title]="title" [description]="description"></app-section-header>

    <ol class="timeline">
      @for (item of items; track item.title) {
        <li class="timeline__item">
          <span class="timeline__date tag">{{ item.date }}</span>
          <div class="timeline__body">
            <h3 class="timeline__title">{{ item.title }}</h3>
            <p class="timeline__org">{{ item.org }}</p>
            @if (item.points?.length) {
              <ul class="timeline__points">
                @for (point of item.points; track point) {
                  <li>{{ point }}</li>
                }
              </ul>
            }
          </div>
        </li>
      }
    </ol>
  </div>
</section>
